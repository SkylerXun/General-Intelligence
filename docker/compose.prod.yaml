services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      new-api:
        condition: service_healthy
      sub2api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN is required}
      ADMIN_ALLOWED_CIDRS: ${ADMIN_ALLOWED_CIDRS:?ADMIN_ALLOWED_CIDRS is required}
      CADDY_EMAIL: ${CADDY_EMAIL:?CADDY_EMAIL is required}
    networks:
      gateway:
        ipv4_address: ${CADDY_INTERNAL_IP:?CADDY_INTERNAL_IP is required}

networks:
  gateway:
    ipam:
      config:
        - subnet: ${GATEWAY_SUBNET:?GATEWAY_SUBNET is required}

volumes:
  caddy_data:
  caddy_config:
