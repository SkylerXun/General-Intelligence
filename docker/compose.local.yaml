services:
  # The migrated WSL already has PostgreSQL 18. Production remains pinned to
  # postgres:16-alpine in compose.yaml; local uses this compatible image to
  # allow offline/slow-network acceptance without changing production.
  postgres:
    image: ${POSTGRES_LOCAL_IMAGE:-postgres:18-alpine}
    ports:
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-54329}:5432"
    volumes: !override
      - postgres_data:/var/lib/postgresql
      - ../config/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/10-init-multiple-dbs.sh:ro

  new-api:
    ports:
      - "127.0.0.1:${NEWAPI_LOCAL_PORT:-3100}:3000"

  sub2api:
    ports:
      - "127.0.0.1:${SUB2API_LOCAL_PORT:-8180}:8080"
